[workspace]
resolver = "2"
members = ["crates/engine-core", "crates/engine-web"]
# Spike code (evaluation instruments, not production) lives in its own
# workspace: excluded from builds, tests, and the coverage gate here.
exclude = ["spikes"]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
