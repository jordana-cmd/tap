<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>engine-core wasm harness</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #f5f5f4; color: #1c1917; }
  h1 { font-size: 1.05rem; }
  #status { font-family: ui-monospace, monospace; white-space: pre-line; background: #fff;
            border: 1px solid #d6d3d1; padding: 8px 12px; min-height: 5.5em; margin-top: 8px; }
  canvas { border: 1px solid #a8a29e; background: #fff; cursor: crosshair; display: block; }
  #canvasWrap { overflow: auto; max-height: 70vh; flex: 1 1 auto; min-width: 0; }
  .bar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 6px 0; font-size: 0.9rem; }
  button { font-size: 0.9rem; }
  #calibFeet { width: 5em; }
  .tool.active { background: #1d4ed8; color: #fff; }
  #workRow { display: flex; gap: 12px; align-items: flex-start; }
  #measPanel { flex: 0 0 285px; background: #fff; border: 1px solid #d6d3d1;
               padding: 8px; font-size: 0.85rem; max-height: 655px; overflow-y: auto; }
  .measRow { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap;
             padding: 3px 4px; border-bottom: 1px solid #e7e5e4; }
  .measRow:hover { background: #eff6ff; }
  .measName { cursor: text; font-weight: 500; }
  .measName:hover { text-decoration: underline dotted; }
  .measVal { flex: 1 1 auto; }
  .measRow .origin { color: #78716c; font-size: 0.75rem; }
  .measRow .measColor { width: 22px; height: 16px; padding: 0; border: none; cursor: pointer; }
  .renameInput { flex: 1 1 100%; font-size: 0.85rem; }
  .measRow button { border: none; background: none; color: #dc2626; cursor: pointer; }
  #projectPanel { background: #fff; border: 1px solid #d6d3d1; padding: 8px; margin: 6px 0;
                  max-width: 640px; font-size: 0.85rem; }
  .projRow { display: flex; align-items: baseline; gap: 10px; padding: 4px;
             border-bottom: 1px solid #e7e5e4; }
  .projRow .projName { font-weight: 500; flex: 1 1 auto; }
  .projRow .projMeta { color: #78716c; font-size: 0.78rem; }
  .projRow button { font-size: 0.8rem; }
  #storageModal:not([hidden]) { position: fixed; inset: 0; background: rgba(0,0,0,0.55);
                  z-index: 1000; display: flex; align-items: center; justify-content: center; }
  #storageModal > div { background: #fff; max-width: 480px; padding: 20px; border-radius: 6px;
                        border: 2px solid #dc2626; }
  #storageModal h2 { color: #dc2626; margin: 0 0 8px; font-size: 1rem; }
  #storageModal .actions { margin-top: 14px; display: flex; gap: 10px; }
</style>
</head>
<body>
<h1>Throwaway harness — click inside a room to flood-fill it (engine-core via wasm)</h1>
<!-- NOTE (§A8 guard): pdf.js here is a measurement INSTRUMENT for this
     throwaway harness only. The product renders server-side tile pyramids;
     client-side full-PDF rendering remains rejected for the product. -->
<div class="bar">
  <input id="file" type="file" accept="application/pdf">
  <span><button id="prev">◀</button> page <span id="pageLabel">–</span> <button id="next">▶</button></span>
  <span>zoom: <button id="zoomOut">−</button> <button id="zoomFit">fit</button>
    <button id="zoomIn">+</button> <span id="zoomLabel">–</span></span>
  <label>scale: <select id="preset"><option value="">— choose or calibrate —</option></select></label>
  <span id="tools">
    <button class="tool active" data-tool="detect">detect</button>
    <button class="tool" data-tool="line">line</button>
    <button class="tool" data-tool="area">area</button>
    <button class="tool" data-tool="wall">wall</button>
    <button class="tool" data-tool="count">count</button>
  </span>
  <button id="calibBtn">Calibrate (2 clicks)</button>
  <span id="calibEntry" hidden>feet: <input id="calibFeet" type="number" min="0.1" step="0.5" value="10">
    <button id="calibApply">Apply</button></span>
  <span>fpi = <b id="fpiLabel">4.0 (synthetic)</b></span>
  <span id="saveState" title="autosave status">—</span>
  <button id="projectsBtn" title="saved projects">Projects</button>
</div>
<div id="projectPanel" hidden>
  <div id="projectQuota" class="origin"></div>
  <div id="projectList"></div>
</div>
<div class="bar">
  <label>wall_threshold: <input id="thresh" type="range" min="0" max="255" step="5" value="200">
    <span id="threshVal">200</span></label>
  <label>door_gap_ft: <input id="doorGap" type="range" min="1" max="15" step="0.5" value="3.5">
    <span id="doorGapVal">3.5</span> ft</label>
</div>
<div class="bar">
  <span>mask:
    <label><input type="radio" name="maskSrc" id="maskRaster" value="raster" checked> raster</label>
    <label><input type="radio" name="maskSrc" id="maskVector" value="vector" disabled> vector</label>
  </span>
  <label>min_width: <input id="minWidth" type="range" min="0" max="2" step="0.01" value="0" disabled>
    <span id="minWidthVal">–</span> pts</label>
  <button id="minWidthReset" hidden title="reset min_width to the per-page derived default">↺ derived</button>
  <label><input id="snapChk" type="checkbox" checked> snap calib clicks</label>
  <label><input id="hideHatch" type="checkbox" checked disabled> hide hatch</label>
  <span id="vecInfo">no vector geometry</span>
</div>
<div id="workRow">
  <div id="canvasWrap"><canvas id="plan" width="900" height="650"></canvas></div>
  <div id="measPanel"><b>Measurements</b>
    <button id="exportCsv" style="float:right" title="download all measurements as CSV">export CSV</button>
    <button id="exportJson" style="float:right;margin-right:6px" title="download a JSON backup of this project">export JSON</button>
    <label id="importJsonLabel" style="float:right;margin-right:6px;cursor:pointer" title="restore a project from a JSON backup">
      import JSON<input id="importJson" type="file" accept="application/json,.json" hidden></label>
    <label style="float:right;font-weight:normal;margin-right:8px"><input id="allPages" type="checkbox"> all pages</label>
    <div id="measList">(none yet)</div></div>
</div>
<div id="status">loading wasm…</div>
<div id="storageModal" hidden>
  <div>
    <h2>⚠ Storage write failed</h2>
    <p id="storageMsg"></p>
    <div class="actions">
      <button id="storageExport">Export JSON backup</button>
      <button id="storageDismiss">Dismiss (I understand)</button>
    </div>
  </div>
</div>

<script type="module">
import init, { detect_room, measure_polyline, measure_polygon_area, calibrate_two_point,
  scale_presets_json, PageGeometry } from './pkg/engine_web.js';
import * as pdfjs from './vendor/pdfjs/pdf.min.mjs';
import { extractSegments } from './extract.js';
import * as store from './store.js';
pdfjs.GlobalWorkerOptions.workerSrc = './vendor/pdfjs/pdf.worker.min.mjs';

const TARGET_PPF = 10, MAX_DIM = 4096;
const canvas = document.getElementById('plan');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const $ = id => document.getElementById(id);
const status = $('status');

// ---- state ----
let pdfDoc = null, pageNum = 1;
// Scale is PER PAGE (§A2 ScaleState is page-scoped; a 74-page set mixes
// scales per sheet). Page 0 = the synthetic demo, seeded at fpi 4.0.
// A page with no entry has NO scale: tools guard until one is set.
// Each entry is {fpi, source} — source ∈ preset|calibrated|param|synthetic
// (provenance flows to CSV export, §A2).
const pageScales = new Map([[0, { fpi: 4.0, source: 'synthetic' }]]);
const currentPage = () => (pdfDoc ? pageNum : 0);
const scaleOf = page => pageScales.get(page)?.fpi ?? null;
const scaleSourceOf = page => pageScales.get(page)?.source ?? null;
const curFpi = () => scaleOf(currentPage()) ?? 4.0; // fallback for display math only
let s = 10 / 18;            // canvas px per PDF point (synthetic: ppf 10 @ fpi 4)
let cleanBitmap = null;     // clean render for overlay redraws
let tool = 'detect';        // 'detect' | 'line' | 'area' | 'wall' | 'count' | 'calibrate'
let calibPts = [];          // collected calibration clicks, base units
let pageGeom = null;        // PageGeometry wasm handle (vector mask + snap)
let segFlat = null;         // the flat [x1,y1,x2,y2,w]×n array behind it
let hatchIds = new Set();   // ids classified as hatch (purple overlay)
let extractCache = new Map(); // pageNum -> {flat, pathCount, curveCount}
let minWidthOverride = null; // session-scoped min_width override (null = per-page derived)

// ---- manual measurement state (all geometry in BASE UNITS) ----
const ANGLE_EPS_RAD = 1.5 * Math.PI / 180; // click-a-wall collinearity
const JOIN_TOL_PTS = 3.0;                  // click-a-wall join tolerance
let draft = null;           // {verts:[{x,y,snapped}], anySnap} while line/area in progress
let countDraft = [];        // in-progress count markers, base units (count tool)
let chainPreview = null;    // parsed chain_json result awaiting commit
let hover = null;           // {x, y, snap} last cursor position (base units)
let measurements = [];      // {id, kind, name, value, valueText, origin, geometry}
let hoverMeas = null;       // measurement id emphasized from the list panel
let measSeq = { Line: 0, Area: 0, 'Wall run': 0, Room: 0, Count: 0 };
let nextMeasId = 1;
let lastClick = null;       // {t, cx, cy} — double-click debounce

// ---- persistence (harness-only IndexedDB; see store.js / README) ----
let currentSha = null;      // content hash of the open PDF (project key)
let currentName = '';       // filename of the open PDF (display only)
let currentBytes = null;    // ArrayBuffer of the open PDF (for file store)
let saveTimer = null;       // debounce handle
let storageBlocked = false; // set on a write failure — blocks further edits

const pxPerFoot = () => (72 / curFpi()) * s;
const say = t => { status.textContent = t; };

// ---- synthetic fallback plan (unchanged demo) ----
function drawSynthetic() {
  canvas.width = 900; canvas.height = 650;
  const ft = v => v * 10;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#000'; ctx.fillRect(ft(4.5), ft(4.5), ft(81), ft(56));
  ctx.fillStyle = '#fff'; ctx.fillRect(ft(5), ft(5), ft(80), ft(55));
  ctx.fillStyle = '#000';
  ctx.fillRect(ft(50), ft(4.5), ft(0.5), ft(56));
  ctx.fillRect(ft(50.5), ft(35), ft(35), ft(0.5));
  ctx.fillStyle = '#fff';
  ctx.fillRect(ft(50), ft(20), ft(0.5), ft(3));
  ctx.fillRect(ft(60), ft(35), ft(8), ft(0.5));
}

async function cacheClean() {
  const old = cleanBitmap;
  cleanBitmap = await createImageBitmap(canvas);
  if (old) old.close(); // bitmaps are GPU-backed; never leak them
}

// Display scale `s` is USER-driven only (fit-width default + zoom). Scale
// (fpi) changes never touch it — invariant 5: geometry is stored in base
// units; changing fpi only re-derives feet values.
let fitS = 10 / 18;         // s that fits the page to the wrap width
let pageDims = null;        // {w, h} in PDF points, current page

function fitWidthScale() {
  if (!pageDims) return s;
  const avail = Math.max(200, $('canvasWrap').clientWidth - 2);
  return Math.min(avail / pageDims.w, MAX_DIM / pageDims.w, MAX_DIM / pageDims.h);
}

const zoomLabel = () =>
  { $('zoomLabel').textContent = pageDims ? `${Math.round((s / fitS) * 100)}%` : '–'; };

/// Re-render the page at scale `next`, keeping the base-unit point
/// `anchor` ({x,y}, or null = viewport center) at the same screen spot.
async function setZoom(next, anchor) {
  if (!pdfDoc || !pageDims) return;
  next = Math.min(next, MAX_DIM / pageDims.w, MAX_DIM / pageDims.h);
  next = Math.max(next, fitS * 0.25);
  const wrap = $('canvasWrap');
  const a = anchor ?? {
    x: (wrap.scrollLeft + wrap.clientWidth / 2) / s,
    y: (wrap.scrollTop + wrap.clientHeight / 2) / s,
  };
  const keepX = a.x * s - wrap.scrollLeft; // screen offset to preserve
  const keepY = a.y * s - wrap.scrollTop;
  s = next;
  await renderPage();
  wrap.scrollLeft = a.x * s - keepX;
  wrap.scrollTop = a.y * s - keepY;
}

let renderGen = 0; // serialize overlapping renderPage calls (rapid zoom)

async function renderPage() {
  const gen = ++renderGen;
  if (!pdfDoc) { drawSynthetic(); await cacheClean(); setGeometry(null); return; }
  try {
    const page = await pdfDoc.getPage(pageNum);
    if (gen !== renderGen) return; // superseded by a newer render
    const base = page.getViewport({ scale: 1 });
    pageDims = { w: base.width, h: base.height };
    const vp = page.getViewport({ scale: s });
    canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    if (gen !== renderGen) return;
    $('pageLabel').textContent = `${pageNum} / ${pdfDoc.numPages}`;
    zoomLabel();
    await cacheClean();
    // Vector geometry is per PAGE (base units), independent of render scale.
    if (!extractCache.has(pageNum)) {
      extractCache.set(pageNum, await extractSegments(page, pdfjs.OPS));
    }
    if (gen !== renderGen) return;
    setGeometry(extractCache.get(pageNum));
    render();
  } catch (e) {
    // A superseded pdf.js render throws — never leave it unhandled (an
    // aborted renderPage is exactly the stale-bitmap window).
    if (gen === renderGen) say(`render error: ${e?.message ?? e}`);
  }
}

// ---- off-screen detection raster (display never re-renders for detect) ----
let detCache = null; // {pageNum, fpi, sDet, w, h, ppf, gray|null}

async function detectRaster(needGray) {
  const f = curFpi();
  const sDet = Math.min((f * TARGET_PPF) / 72,
                        MAX_DIM / pageDims.w, MAX_DIM / pageDims.h);
  if (!detCache || detCache.pageNum !== pageNum || detCache.fpi !== f) {
    detCache = {
      pageNum, fpi: f, sDet,
      w: Math.round(pageDims.w * sDet),
      h: Math.round(pageDims.h * sDet),
      ppf: (72 / f) * sDet,
      gray: null,
    };
  }
  if (needGray && !detCache.gray) {
    const page = await pdfDoc.getPage(pageNum);
    const vp = page.getViewport({ scale: detCache.sDet });
    const off = document.createElement('canvas');
    off.width = detCache.w; off.height = detCache.h;
    const octx = off.getContext('2d', { willReadFrequently: true });
    octx.fillStyle = '#fff'; octx.fillRect(0, 0, off.width, off.height);
    await page.render({ canvasContext: octx, viewport: vp }).promise;
    const img = octx.getImageData(0, 0, off.width, off.height).data;
    const gray = new Uint8Array(off.width * off.height);
    for (let i = 0; i < gray.length; i++) {
      gray[i] = (0.299 * img[4 * i] + 0.587 * img[4 * i + 1] + 0.114 * img[4 * i + 2]) | 0;
    }
    detCache.gray = gray;
  }
  return detCache;
}

/// min_width re-derives per page (each sheet's linework differs), BUT a
/// manual slider move sets a session override that sticks across pages
/// until "↺ derived" clears it (the agreed best-of-both behavior).
function syncMinWidth(derivedDefault) {
  const max = parseFloat($('minWidth').max);
  const v = minWidthOverride != null ? Math.min(minWidthOverride, max) : derivedDefault;
  $('minWidth').value = v.toFixed(2);
  $('minWidthVal').textContent = v.toFixed(2);
  $('minWidthReset').hidden = minWidthOverride == null;
}

/// Swap the PageGeometry handle (freeing the old one) and sync the vector UI.
function setGeometry(extracted) {
  if (pageGeom) { pageGeom.free(); pageGeom = null; segFlat = null; }
  const hasVectors = extracted && extracted.flat.length > 0;
  if (hasVectors) {
    segFlat = extracted.flat;
    pageGeom = new PageGeometry(segFlat);
    hatchIds = new Set(pageGeom.hatch_segment_ids());
    const hist = JSON.parse(pageGeom.histogram_json());
    const def = pageGeom.default_min_width();
    const maxW = hist.length ? hist[hist.length - 1].width_pts : 1;
    $('minWidth').max = (maxW * 1.25).toFixed(2);
    syncMinWidth(def);
    $('vecInfo').textContent =
      `${pageGeom.segment_count} segs, ${extracted.curveCount} curves skipped, ` +
      `${hatchIds.size} hatch, ` +
      `widths [${hist.map(b => `${b.width_pts}:${b.segments}`).join(' ')}]`;
    $('vecInfo').title = `hatch params: ${pageGeom.hatch_params_json()}`;
    $('maskVector').disabled = false; $('minWidth').disabled = false;
    $('hideHatch').disabled = false;
    $('maskVector').checked = true;   // vector is the primary path when present
  } else {
    hatchIds = new Set();
    $('maskVector').disabled = true; $('minWidth').disabled = true;
    $('hideHatch').disabled = true;
    $('maskRaster').checked = true;
    $('minWidthVal').textContent = '–';
    $('vecInfo').textContent = 'no vector geometry (raster fallback)';
  }
}

const maskSource = () => ($('maskVector').checked ? 'vector' : 'raster');
const minWidthPts = () => parseFloat($('minWidth').value);

/// Guaranteed-clean compositor base: ALWAYS clear the full canvas before
/// laying the page bitmap down. Accumulation of transient overlays is
/// impossible regardless of bitmap state (a stale-size bitmap after an
/// aborted render no longer leaves uncleared regions — the confirmed
/// indicator-accumulation bug).
function redraw() {
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (cleanBitmap) ctx.drawImage(cleanBitmap, 0, 0);
}

function strokeFlat(flat, closed) {
  ctx.beginPath();
  ctx.moveTo(flat[0] * s, flat[1] * s);
  for (let i = 2; i < flat.length; i += 2) ctx.lineTo(flat[i] * s, flat[i + 1] * s);
  if (closed) ctx.closePath();
}

/// "#rrggbb" + alpha → rgba() string (measurement fills).
function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}

/// Stroke the current path twice — white underlay, then color — so
/// working geometry reads over dense background linework.
function haloStroke(color, width, dash) {
  if (dash) ctx.setLineDash(dash);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = width + 2;
  ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.stroke();
  if (dash) ctx.setLineDash([]);
}

/// White-ringed square vertex dot — every click stays visible.
function vertexDot(x, y, size, color) {
  ctx.fillStyle = '#fff';
  ctx.fillRect(x * s - size / 2 - 1.5, y * s - size / 2 - 1.5, size + 3, size + 3);
  ctx.fillStyle = color;
  ctx.fillRect(x * s - size / 2, y * s - size / 2, size, size);
}

/// Halo-backed label text.
function haloText(text, x, y, color, font) {
  ctx.font = font;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

/// Numbered count markers: white-ringed filled dot per point, 1..n label.
function drawCountMarkers(flat, color, hot) {
  const r = hot ? 8 : 6;
  for (let i = 0; i < flat.length; i += 2) {
    const cx = flat[i] * s, cy = flat[i + 1] * s;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx, cy, r + 1.5, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.fill();
    haloText(String(i / 2 + 1), cx + r + 2, cy - r, color,
             `bold ${hot ? 12 : 11}px ui-monospace, monospace`);
  }
}

/// One full-frame redraw: bitmap → skeleton (dim, background) →
/// committed measurements → draft/rubber-band → chain preview → snap or
/// close indicator (foreground). Geometry lives in base units and is
/// scaled by `s` only here (display transform only).
function render() {
  redraw();
  if (maskSource() === 'vector' && pageGeom) {
    // Background reference — deliberately dim so measurements pop.
    // Hatch-classified segments draw PURPLE (see what the classifier
    // caught before trusting it); kept wall ink draws red.
    const ids = pageGeom.wall_segment_ids(minWidthPts());
    ctx.strokeStyle = 'rgba(220, 38, 38, 0.35)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (const id of ids) {
      if (hatchIds.has(id)) continue;
      const o = id * 5;
      ctx.moveTo(segFlat[o] * s, segFlat[o + 1] * s);
      ctx.lineTo(segFlat[o + 2] * s, segFlat[o + 3] * s);
    }
    ctx.stroke();
    if (hatchIds.size) {
      ctx.strokeStyle = $('hideHatch').checked
        ? 'rgba(147, 51, 234, 0.25)'   // excluded from the mask: faint
        : 'rgba(147, 51, 234, 0.6)';   // still in the mask: prominent
      ctx.beginPath();
      for (const id of hatchIds) {
        const o = id * 5;
        ctx.moveTo(segFlat[o] * s, segFlat[o + 1] * s);
        ctx.lineTo(segFlat[o + 2] * s, segFlat[o + 3] * s);
      }
      ctx.stroke();
    }
  }
  for (const m of measurements) {
    if (m.page !== currentPage()) continue; // page-scoped rendering
    const hot = m.id === hoverMeas;
    const col = m.color;
    if (m.kind === 'count') {
      drawCountMarkers(m.geometry, col, hot);
      continue;
    }
    strokeFlat(m.geometry, m.kind === 'area');
    if (m.kind === 'area') {
      ctx.fillStyle = hexToRgba(col, hot ? 0.4 : 0.28);
      ctx.fill();
    }
    // Hover emphasis is WIDTH-based, not a fixed colour, so any custom
    // measurement colour stays visible when highlighted from the list.
    haloStroke(col, hot ? 5 : 3);
    const g = m.geometry;
    for (let i = 0; i < g.length; i += 2) vertexDot(g[i], g[i + 1], hot ? 5 : 4, col);
  }
  if (countDraft.length) {
    drawCountMarkers(countDraft.flatMap(p => [p.x, p.y]), '#0e7490', false);
  }
  if (draft && draft.verts.length) {
    const pts = draft.verts.flatMap(v => [v.x, v.y]);
    if (hover) pts.push(hover.x, hover.y);
    strokeFlat(pts, false);
    haloStroke('#0e7490', 3, [7, 5]);
    for (const v of draft.verts) vertexDot(v.x, v.y, 7, '#0e7490');
  }
  if (chainPreview) {
    ctx.beginPath();
    for (const id of chainPreview.ids) {
      const o = id * 5;
      ctx.moveTo(segFlat[o] * s, segFlat[o + 1] * s);
      ctx.lineTo(segFlat[o + 2] * s, segFlat[o + 3] * s);
    }
    haloStroke('#c2410c', 5);
    for (const p of [chainPreview.start, chainPreview.end]) marker(p.x * s, p.y * s, '#c2410c');
  }
  // Calibration clicks are STATE, drawn here every frame — never painted
  // directly from event handlers (the transient-as-persistent class).
  for (const p of calibPts) {
    marker(p.x * s, p.y * s, p.snapped ? '#16a34a' : '#dc2626');
  }
  if (hover && hover.closing && draft && draft.verts.length) {
    // Distinct close indicator: clicking will close the polygon here.
    // (draft guard: hover can still carry `closing` from the last
    // mousemove right after the closing click commits and nulls draft.)
    const v0 = draft.verts[0];
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(v0.x * s, v0.y * s, 11, 0, 2 * Math.PI);
    ctx.fill();
    ctx.fillStyle = 'rgba(234, 88, 12, 0.9)';
    ctx.beginPath();
    ctx.arc(v0.x * s, v0.y * s, 9, 0, 2 * Math.PI);
    ctx.fill();
    haloText('close', v0.x * s + 13, v0.y * s - 11, '#c2410c',
             'bold 12px ui-monospace, monospace');
  } else if (hover && hover.snap) {
    const { x, y, kind } = hover.snap;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(x * s, y * s, 5.5, 0, 2 * Math.PI);
    ctx.stroke();
    ctx.strokeStyle = '#15803d'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(x * s, y * s, 5.5, 0, 2 * Math.PI);
    ctx.stroke();
    haloText(kind, x * s + 9, y * s - 9, '#15803d', '11px ui-monospace, monospace');
  }
}

function grayscale() {
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  const gray = new Uint8Array(canvas.width * canvas.height);
  for (let i = 0; i < gray.length; i++) {
    gray[i] = (0.299 * img[4 * i] + 0.587 * img[4 * i + 1] + 0.114 * img[4 * i + 2]) | 0;
  }
  return gray;
}

function marker(x, y, color = '#dc2626') {
  ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - 8, y); ctx.lineTo(x + 8, y);
  ctx.moveTo(x, y - 8); ctx.lineTo(x, y + 8);
  ctx.stroke();
}

/// Click-to-room from a BASE-unit click. Detection rasterizes OFF-SCREEN
/// at the target ppf — the visible canvas (user-owned zoom) never
/// re-renders because of detection or scale changes.
async function runDetect(baseX, baseY) {
  if (!scaleGuard()) return;
  const f = curFpi();
  const src = maskSource();
  const threshold = parseInt($('thresh').value, 10);
  const doorGap = parseFloat($('doorGap').value);
  try {
    let r, x, y, ppfUsed;
    if (pdfDoc) {
      const det = await detectRaster(src !== 'vector');
      x = Math.round(baseX * det.sDet); y = Math.round(baseY * det.sDet);
      ppfUsed = det.ppf;
      r = src === 'vector'
        ? pageGeom.detect_room_vector(det.w, det.h, x, y, f, det.ppf,
                                      minWidthPts(), $('hideHatch').checked,
                                      doorGap)
        : detect_room(det.gray, det.w, det.h, x, y, f, det.ppf,
                      threshold, doorGap);
    } else {
      // Synthetic demo: the visible canvas IS the raster.
      redraw();
      const gray = grayscale(); // copied into wasm per call; buffer stays ours
      x = Math.round(baseX * s); y = Math.round(baseY * s);
      ppfUsed = pxPerFoot();
      r = detect_room(gray, canvas.width, canvas.height, x, y,
                      f, ppfUsed, threshold, doorGap);
    }
    const c = r.contour;
    const closed = new Float64Array(c.length + 2);
    closed.set(c); closed[c.length] = c[0]; closed[c.length + 1] = c[1];
    const viaPolyline = measure_polyline(closed, curFpi());
    // Detected rooms land in the SAME list as manual measurements —
    // interchangeable rows, provenance preserved (origin 'floodfill').
    addMeasurement('area', 'Room', r.area_sf,
      `${r.area_sf.toFixed(1)} SF (${r.perimeter_lf.toFixed(1)} LF)`, 'floodfill', c);
    const knobs = src === 'vector'
      ? `min_width ${minWidthPts().toFixed(2)} pts`
      : `threshold ${threshold}`;
    say(`click (${x}, ${y}) det-px | mask ${src} | fpi ${curFpi().toFixed(3)} | ` +
        `det ppf ${ppfUsed.toFixed(2)} | ${knobs} | door_gap ${doorGap}\n` +
        `area_sf       = ${r.area_sf.toFixed(1)} SF\n` +
        `perimeter_lf  = ${r.perimeter_lf.toFixed(1)} LF\n` +
        `measure_polyline(closed contour) = ${viaPolyline.toFixed(1)} LF  (cross-check: ` +
        `${Math.abs(viaPolyline - r.perimeter_lf) < 1e-6 ? 'MATCH' : 'MISMATCH'})\n` +
        `contour vertices = ${c.length / 2}`);
  } catch (e) {
    render();
    if (e && e.code === 'REGION_NOT_ENCLOSED') {
      say(`[${e.code}] Region not enclosed — falling back to manual trace.\n(${e.message})`);
    } else if (e && e.code) {
      say(`[${e.code}] ${e.message}`);
    } else {
      say(`unexpected error: ${e}`);
    }
  }
}

function applyCalibration(feet) {
  try {
    const [a, b] = calibPts;
    const v = calibrate_two_point(a.x, a.y, b.x, b.y, feet);
    $('preset').value = '';
    setTool('detect'); $('calibEntry').hidden = true;
    applyScaleChange(v, 'calibrated'); // view does NOT move; values revalue
    say(`calibrated: page ${currentPage()} fpi = ${v.toFixed(4)}. Click a room.`);
  } catch (e) {
    say(e && e.code ? `[${e.code}] ${e.message}` : `unexpected error: ${e}`);
    setTool('detect'); $('calibEntry').hidden = true;
  }
}

// ---- measurement list ----
function addMeasurement(kind, family, value, valueText, origin, geometry) {
  measSeq[family] += 1;
  measurements.push({
    id: nextMeasId++,
    kind,
    name: `${family} ${measSeq[family]}`,
    value, valueText, origin,
    page: currentPage(), // authoritative at commit time (§A2)
    color: '#1e3a8a',    // user-recolourable (measurement editing)
    geometry: Float64Array.from(geometry),
  });
  renderMeasList();
  render();
  markDirty();
  return measurements[measurements.length - 1];
}

/// Invariant 5: geometry is base units; feet values are DERIVED. On any
/// fpi change, recompute every measurement's value in place — nothing on
/// screen moves, only the numbers update.
function revalueMeasurements() {
  for (const m of measurements) {
    if (m.kind === 'count') continue; // EA quantity is scale-independent
    // Values derive from the OWNING page's scale, not the current page's.
    const f = scaleOf(m.page);
    if (f == null) continue; // committed under a scale; defensive only
    const flat = Array.from(m.geometry);
    if (m.kind === 'linear') {
      m.value = measure_polyline(flat, f);
      m.valueText = `${m.value.toFixed(1)} LF`;
    } else {
      const ring = flat.concat(flat.slice(0, 2));
      m.value = measure_polygon_area(flat, f);
      const lf = measure_polyline(ring, f);
      m.valueText = `${m.value.toFixed(1)} SF (${lf.toFixed(1)} LF)`;
    }
  }
  renderMeasList();
}

/// A scale change for the CURRENT page: store + label + revalue + detect
/// cache invalidation. Deliberately NO renderPage() — the view must not
/// move (invariant 5: values re-derive, geometry stays put).
function applyScaleChange(newFpi, sourceLabel) {
  pageScales.set(currentPage(), { fpi: newFpi, source: sourceLabel });
  $('fpiLabel').textContent = `${newFpi.toFixed(4)} (${sourceLabel}, p${currentPage()})`;
  detCache = null;
  revalueMeasurements();
  render();
  markDirty();
}

// ---- persistence: §A2-mirroring serialization + debounced autosave ----

/// Measurement → stored record. Mirrors §A2 field names; NEVER stores
/// derived values (invariant 5 — value/valueText recompute on load).
/// `color` is a documented harness display-only extension.
function toStored(m) {
  return {
    id: m.id, page: m.page, kind: m.kind, label: m.name, origin: m.origin,
    geometry: Array.from(m.geometry),
    confirmedBy: null, parentId: null, deleted: null, // §A2 optionals, unused here
    color: m.color,
  };
}
function fromStored(r) {
  return {
    id: r.id, kind: r.kind, name: r.label, origin: r.origin, page: r.page,
    color: r.color ?? '#1e3a8a',
    value: 0, valueText: '', // recomputed below
    geometry: Float64Array.from(r.geometry),
  };
}
/// Rebuild derived quantity/text after restore or import (invariant 5).
function recomputeAll() {
  for (const m of measurements) {
    if (m.kind === 'count') { m.value = m.geometry.length / 2; m.valueText = `${m.value} EA`; continue; }
    const f = scaleOf(m.page);
    const flat = Array.from(m.geometry);
    if (f == null) { m.valueText = '(no scale)'; continue; }
    if (m.kind === 'linear') {
      m.value = measure_polyline(flat, f);
      m.valueText = `${m.value.toFixed(1)} LF`;
    } else {
      const ring = flat.concat(flat.slice(0, 2));
      m.value = measure_polygon_area(flat, f);
      m.valueText = `${m.value.toFixed(1)} SF (${measure_polyline(ring, f).toFixed(1)} LF)`;
    }
  }
}

/// pageScales Map → stored array (§A2 ScaleState names) and back.
function scalesToStored() {
  return [...pageScales].map(([page, v]) =>
    ({ page, feet_per_paper_inch: v.fpi, source: v.source, verification: null }));
}
function scalesFromStored(arr) {
  pageScales.clear();
  for (const r of arr) pageScales.set(r.page, { fpi: r.feet_per_paper_inch, source: r.source });
  if (!pageScales.has(0)) pageScales.set(0, { fpi: 4.0, source: 'synthetic' });
}

/// After restoring/importing measurements: derive quantities, and set the
/// id + name counters past what was restored so new commits never collide.
function reindexAfterRestore() {
  recomputeAll();
  nextMeasId = 1 + measurements.reduce((mx, m) => Math.max(mx, m.id), 0);
  measSeq = { Line: 0, Area: 0, 'Wall run': 0, Room: 0, Count: 0 };
  for (const m of measurements) {
    const mm = /^(Line|Area|Wall run|Room|Count) (\d+)$/.exec(m.name);
    if (mm) measSeq[mm[1]] = Math.max(measSeq[mm[1]], +mm[2]);
  }
}

/// Portable project backup — the escape hatch if IndexedDB is cleared.
/// Same §A2-mirroring shape as the stored record (no derived values).
function exportJson() {
  return JSON.stringify({
    version: 1, sha: currentSha, name: currentName,
    pageScales: scalesToStored(),
    measurements: measurements.map(toStored),
    minWidthOverride,
  }, null, 2);
}
function importJson(str) {
  const data = JSON.parse(str);
  scalesFromStored(data.pageScales ?? []);
  measurements = (data.measurements ?? []).map(fromStored);
  minWidthOverride = data.minWidthOverride ?? null;
  reindexAfterRestore();
  refreshScaleUI();
  renderMeasList();
  render();
  markDirty();
}

function projectRecord() {
  return {
    sha: currentSha, name: currentName,
    pageScales: scalesToStored(),
    measurements: measurements.map(toStored),
    minWidthOverride, updatedAt: Date.now(),
  };
}

const saveTime = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function setSaveState(text) { $('saveState').textContent = text; }

/// Persist project + file bytes. Wrapped — a write failure blocks edits
/// behind a modal rather than silently losing work.
async function saveProject() {
  if (!currentSha) return;
  setSaveState('Saving…');
  try {
    await store.putProject(projectRecord());
    if (currentBytes) {
      await store.putFile({ sha: currentSha, name: currentName,
                            size: currentBytes.byteLength, bytes: currentBytes });
    }
    setSaveState(`Saved ${saveTime()}`);
  } catch (e) {
    onStorageError(e);
  }
}

/// Debounced autosave after any mutation (no-op on the synthetic demo).
function markDirty() {
  if (!currentSha || storageBlocked) return;
  setSaveState('unsaved…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveProject, 800);
}

/// Force any pending save to complete now (deterministic tests).
async function flushSave() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; await saveProject(); }
}

function onStorageError(e) {
  storageBlocked = true;
  setSaveState('SAVE FAILED');
  const modal = $('storageModal');
  if (modal) {
    $('storageMsg').textContent = `Storage write failed: ${e?.message ?? e}. `
      + 'Your work is NOT being saved — export a JSON backup, then free space or clear other data.';
    modal.hidden = false;
  }
}

// ---- project list panel ----
const fmtBytes = n => n == null ? '?' : `${(n / 1048576).toFixed(1)} MB`;

async function openProject(sha) {
  const rec = await store.getFile(sha);
  if (!rec) { say('project bytes missing — reopen by loading the PDF'); return; }
  $('projectPanel').hidden = true;
  await loadPdf(rec.bytes, rec.name);
}

async function renderProjectPanel() {
  const list = $('projectList');
  list.textContent = '';
  const [projects, est] = await Promise.all([store.listProjects(), store.estimate()]);
  $('projectQuota').textContent = est.usage == null ? ''
    : `storage: ${fmtBytes(est.usage)} used${est.quota ? ` of ${fmtBytes(est.quota)}` : ''}`;
  if (!projects.length) { list.textContent = '(no saved projects yet)'; return; }
  for (const p of projects) {
    const row = document.createElement('div');
    row.className = 'projRow';
    const name = document.createElement('span');
    name.className = 'projName'; name.textContent = p.name || p.sha.slice(0, 8);
    const meta = document.createElement('span');
    meta.className = 'projMeta';
    const pages = new Set(p.measurements.map(m => m.page)).size;
    meta.textContent = `${p.measurements.length} measurement(s) · ${pages} page(s) · `
      + `opened ${new Date(p.updatedAt).toLocaleString([], { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' })}`;
    const open = document.createElement('button');
    open.textContent = 'open';
    open.addEventListener('click', () => openProject(p.sha));
    const del = document.createElement('button');
    del.textContent = '✕'; del.style.color = '#dc2626';
    del.addEventListener('click', async () => {
      if (!confirm(`Delete project "${p.name || p.sha.slice(0, 8)}" and its stored PDF? This cannot be undone.`)) return;
      await store.deleteProject(p.sha);
      renderProjectPanel();
    });
    row.append(name, meta, open, del);
    list.append(row);
  }
}

/// Sync the scale chip to the current page (page switches, file loads).
function refreshScaleUI() {
  const f = scaleOf(currentPage());
  $('fpiLabel').textContent = f == null ? '— set scale —' : `${f.toFixed(4)} (p${currentPage()})`;
  $('preset').value = '';
}

function renderMeasList() {
  const list = $('measList');
  list.textContent = '';
  const all = $('allPages').checked;
  const visible = measurements.filter(m => all || m.page === currentPage());
  if (!visible.length) {
    list.textContent = all ? '(none yet)' : `(none on ${pdfDoc ? `page ${currentPage()}` : 'this sheet'})`;
    return;
  }
  for (const m of visible) {
    const row = document.createElement('div');
    row.className = 'measRow';
    // Name — click to rename inline (free text, flows to CSV export).
    const name = document.createElement('span');
    name.className = 'measName';
    name.title = 'click to rename';
    name.textContent = m.name;
    name.addEventListener('click', () => beginRename(m, name));
    const value = document.createElement('span');
    value.className = 'measVal';
    value.textContent = ` — ${m.valueText}`;
    const origin = document.createElement('span');
    origin.className = 'origin';
    origin.textContent = `${m.origin} · ${m.page === 0 ? 'syn' : `p${m.page}`}`;
    const colour = document.createElement('input');
    colour.type = 'color'; colour.className = 'measColor'; colour.value = m.color;
    colour.title = 'measurement colour';
    colour.addEventListener('input', () => { m.color = colour.value; render(); markDirty(); });
    const del = document.createElement('button');
    del.textContent = '✕';
    del.addEventListener('click', () => {
      measurements = measurements.filter(x => x.id !== m.id);
      if (hoverMeas === m.id) hoverMeas = null;
      renderMeasList(); render(); markDirty();
    });
    row.addEventListener('mouseenter', () => { hoverMeas = m.id; render(); });
    row.addEventListener('mouseleave', () => { hoverMeas = null; render(); });
    row.append(name, value, origin, colour, del);
    list.append(row);
  }
}

const UNIT = { linear: 'LF', area: 'SF', count: 'EA' };

/// One CSV cell: quote if it contains comma, quote, or newline; double
/// internal quotes. Names are free text, so this is load-bearing.
function csvCell(v) {
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

/// CSV of every measurement across all pages, with §A2 provenance: an
/// estimator must see which numbers a human drew (manual/snap) vs the
/// engine detected (floodfill), and under which page scale.
function buildCsv() {
  const header = ['page', 'name', 'kind', 'quantity', 'unit',
                  'origin', 'page_scale_fpi', 'scale_source'];
  const rows = [header.join(',')];
  for (const m of measurements) {
    const fpiOf = scaleOf(m.page);          // blank for a count on an unscaled page
    rows.push([
      m.page,
      csvCell(m.name),
      m.kind,
      m.value.toFixed(2),
      UNIT[m.kind] ?? '',
      m.origin,
      fpiOf == null ? '' : fpiOf.toFixed(4),
      csvCell(scaleSourceOf(m.page) ?? ''),
    ].join(','));
  }
  return rows.join('\n') + '\n';
}

/// Swap a name span for an inline text input; Enter/blur commits, Esc
/// reverts. Names are per-measurement free text.
function beginRename(m, span) {
  const input = document.createElement('input');
  input.className = 'renameInput'; input.value = m.name;
  let done = false;
  const commit = save => {
    if (done) return; done = true;
    if (save) { const v = input.value.trim(); if (v && v !== m.name) { m.name = v; markDirty(); } }
    renderMeasList();
  };
  input.addEventListener('keydown', ev => {
    ev.stopPropagation(); // don't let Enter/Backspace reach the canvas tools
    if (ev.key === 'Enter') commit(true);
    else if (ev.key === 'Escape') commit(false);
  });
  input.addEventListener('blur', () => commit(true));
  span.replaceWith(input);
  input.focus(); input.select();
}

// ---- tool interaction ----
function setTool(next) {
  tool = next;
  cancelTransients(null);
  for (const b of document.querySelectorAll('#tools .tool')) {
    b.classList.toggle('active', b.dataset.tool === next);
  }
  const hints = {
    detect: 'detect: click inside a room to flood-fill it.',
    line: 'line: click vertices (Shift = H/V/45), Enter/double-click finishes, Backspace undoes, Esc cancels.',
    area: 'area: click vertices, Enter/double-click closes the polygon, Backspace undoes, Esc cancels.',
    wall: 'wall: click near a wall to preview its collinear run, Enter/double-click commits, Esc clears.',
    count: 'count: click each symbol (doors, fixtures…), Enter commits the group as EA, Backspace removes last, Esc cancels. No scale needed.',
    calibrate: 'Calibration: click one end of a known printed dimension.',
  };
  say(hints[next]);
  render();
}

/// Cursor event → base units, with snap (unless Shift constrains) applied.
/// `closing` = area tool hovering its own first vertex: the close-and-
/// commit gesture, which overrides both snap and constraint.
function cursorPoint(ev) {
  const rect = canvas.getBoundingClientRect();
  const cx = (ev.clientX - rect.left) * canvas.width / rect.width;
  const cy = (ev.clientY - rect.top) * canvas.height / rect.height;
  let pt = { x: cx / s, y: cy / s, snap: null, closing: false };
  if (tool === 'area' && draft && draft.verts.length >= 3) {
    const v0 = draft.verts[0];
    if (Math.hypot(pt.x - v0.x, pt.y - v0.y) <= 10 / s) {
      return { x: v0.x, y: v0.y, snap: null, closing: true };
    }
  }
  const last = draft && draft.verts.length ? draft.verts[draft.verts.length - 1] : null;
  if (ev.shiftKey && last && (tool === 'line' || tool === 'area')) {
    // Constrain to the nearest of the 8 H/V/45° rays from the last vertex
    // (constraint replaces geometry snap while held — the two fight).
    const dx = pt.x - last.x, dy = pt.y - last.y;
    const ang = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
    const t = dx * Math.cos(ang) + dy * Math.sin(ang);
    pt.x = last.x + t * Math.cos(ang);
    pt.y = last.y + t * Math.sin(ang);
  } else if ($('snapChk').checked && pageGeom && tool !== 'count') {
    // Counts click symbols, not geometry — snapping stays off for them.
    const hit = pageGeom.snap_json(pt.x, pt.y, 10 / s);
    if (hit) {
      pt.snap = JSON.parse(hit);
      pt.x = pt.snap.x;
      pt.y = pt.snap.y;
    }
  }
  return pt;
}

const draftFlat = withHover => {
  const pts = draft.verts.flatMap(v => [v.x, v.y]);
  if (withHover && hover) pts.push(hover.x, hover.y);
  return pts;
};

function draftStatus() {
  if (!draft || !draft.verts.length) return;
  const flat = draftFlat(true);
  if (tool === 'line') {
    const lf = measure_polyline(flat, curFpi());
    say(`line: ${draft.verts.length} vertex(es), running ${lf.toFixed(1)} LF — ` +
        'Enter/double-click finishes, Backspace undoes, Esc cancels.');
  } else {
    const ring = flat.concat(flat.slice(0, 2));
    const sf = measure_polygon_area(flat, curFpi());
    const lf = measure_polyline(ring, curFpi());
    say(`area: ${draft.verts.length} vertex(es), ${sf.toFixed(1)} SF, perimeter ${lf.toFixed(1)} LF — ` +
        'Enter/double-click closes, Backspace undoes, Esc cancels.');
  }
}

function finishDraft() {
  if (!draft) return;
  const need = tool === 'area' ? 3 : 2;
  if (draft.verts.length < need) { say(`need at least ${need} vertices`); return; }
  const flat = draftFlat(false);
  const origin = draft.anySnap ? 'snap' : 'manual';
  if (tool === 'line') {
    const lf = measure_polyline(flat, curFpi());
    const m = addMeasurement('linear', 'Line', lf, `${lf.toFixed(1)} LF`, origin, flat);
    say(`${m.name} committed: ${lf.toFixed(1)} LF — line tool armed, click to start the next one.`);
  } else {
    const ring = flat.concat(flat.slice(0, 2));
    const sf = measure_polygon_area(flat, curFpi());
    const lf = measure_polyline(ring, curFpi());
    const m = addMeasurement('area', 'Area', sf, `${sf.toFixed(1)} SF (${lf.toFixed(1)} LF)`, origin, flat);
    say(`${m.name} committed: ${sf.toFixed(1)} SF, perimeter ${lf.toFixed(1)} LF — area tool armed, click to start the next one.`);
  }
  draft = null;
  render();
}

function commitCount() {
  if (!countDraft.length) { say('no markers to commit'); return; }
  const flat = countDraft.flatMap(p => [p.x, p.y]);
  const n = countDraft.length;
  const m = addMeasurement('count', 'Count', n, `${n} EA`, 'manual', flat);
  say(`${m.name} committed: ${n} EA — count tool armed, click to start the next group.`);
  countDraft = [];
  render();
}

function commitChain() {
  if (!chainPreview) return;
  const c = chainPreview;
  const flat = [c.start.x, c.start.y, c.end.x, c.end.y];
  const lf = measure_polyline(flat, curFpi());
  const m = addMeasurement('linear', 'Wall run', lf, `${lf.toFixed(1)} LF`, 'snap', flat);
  say(`${m.name} committed: ${lf.toFixed(1)} LF (${c.ids.length} segment(s)) — wall tool armed, click the next wall.`);
  chainPreview = null;
  render();
}

function scaleGuard() {
  if (scaleOf(currentPage()) == null) {
    say(`Set a scale for page ${currentPage()} first (preset or calibration).`);
    return false;
  }
  return true;
}

canvas.addEventListener('mousemove', ev => {
  hover = cursorPoint(ev);
  render();
  if (draft) draftStatus();
});

canvas.addEventListener('click', ev => {
  if (storageBlocked) return; // edits blocked until the storage error is acknowledged
  const pt = cursorPoint(ev);
  if (tool === 'calibrate') {
    const snapNote = pt.snap
      ? ` [snap: ${pt.snap.kind} seg#${pt.snap.segment}` +
        (pt.snap.other !== undefined ? `∩#${pt.snap.other}` : '') + ']'
      : '';
    calibPts.push({ x: pt.x, y: pt.y, snapped: !!pt.snap });
    render();
    if (calibPts.length === 2) {
      $('calibEntry').hidden = false;
      say(`Both points set${snapNote} — enter the real distance in feet and Apply.`);
    } else {
      say(`First point set${snapNote} — click the other end of the known dimension.`);
    }
    return;
  }
  if (tool === 'line' || tool === 'area') {
    if (!scaleGuard()) return;
    // Close gesture (area): clicking the first vertex closes and commits.
    if (pt.closing) { finishDraft(); return; }
    // Double-click debounce: the second click of a double-click must not
    // add a stray vertex — the dblclick event finishes the draft instead.
    if (lastClick && ev.timeStamp - lastClick.t < 350 &&
        Math.hypot(ev.clientX - lastClick.cx, ev.clientY - lastClick.cy) < 5) {
      return;
    }
    lastClick = { t: ev.timeStamp, cx: ev.clientX, cy: ev.clientY };
    if (!draft) draft = { verts: [], anySnap: false };
    draft.verts.push({ x: pt.x, y: pt.y });
    if (pt.snap) draft.anySnap = true;
    render();
    draftStatus();
    return;
  }
  if (tool === 'count') {
    // Counts are EA (scale-independent) and click SYMBOLS, not geometry:
    // no scale guard, no snap. Use the RAW base-unit point (cursorPoint's
    // `pt` may be snapped); the marker still records its base position.
    const rect = canvas.getBoundingClientRect();
    const rx = (ev.clientX - rect.left) * canvas.width / rect.width / s;
    const ry = (ev.clientY - rect.top) * canvas.height / rect.height / s;
    countDraft.push({ x: rx, y: ry });
    render();
    say(`count: ${countDraft.length} marker(s) — Enter commits, Backspace removes last, Esc cancels.`);
    return;
  }
  if (tool === 'wall') {
    if (!scaleGuard()) return;
    if (!pageGeom) { say('no vector geometry on this page'); return; }
    const rect = canvas.getBoundingClientRect();
    const rawX = (ev.clientX - rect.left) * canvas.width / rect.width / s;
    const rawY = (ev.clientY - rect.top) * canvas.height / rect.height / s;
    const hit = pageGeom.chain_json(rawX, rawY, 10 / s, ANGLE_EPS_RAD, JOIN_TOL_PTS);
    if (!hit) { chainPreview = null; render(); say('no wall within tolerance'); return; }
    chainPreview = JSON.parse(hit);
    const lf = measure_polyline(
      [chainPreview.start.x, chainPreview.start.y, chainPreview.end.x, chainPreview.end.y], curFpi());
    render();
    say(`wall run preview: ${chainPreview.ids.length} segment(s), ${lf.toFixed(1)} LF — ` +
        'Enter/double-click commits, click elsewhere re-previews, Esc clears.');
    return;
  }
  runDetect(pt.x, pt.y);
});

canvas.addEventListener('dblclick', () => {
  // The click debounce already swallowed the double-click's second click,
  // so no stray vertex exists to pop.
  if (tool === 'line' || tool === 'area') finishDraft();
  else if (tool === 'wall') commitChain();
});

window.addEventListener('keydown', ev => {
  // Swallow keys only for genuine text entry. Leftover focus on sliders,
  // selects, or buttons must not eat Enter/Backspace/Esc — a real
  // hands-on failure mode (focus stays on the last-touched control).
  if (ev.target === $('calibFeet') || ev.target === $('file')) return;
  if (storageBlocked) return; // edits blocked until the storage error is acknowledged
  if (ev.key === 'Enter') {
    if (tool === 'line' || tool === 'area') { ev.preventDefault(); finishDraft(); }
    else if (tool === 'wall') { ev.preventDefault(); commitChain(); }
    else if (tool === 'count') { ev.preventDefault(); commitCount(); }
  } else if (ev.key === 'Backspace') {
    if (tool === 'count' && countDraft.length) {
      countDraft.pop();
      render();
      say(`count: ${countDraft.length} marker(s) — Enter commits, Backspace removes last, Esc cancels.`);
      ev.preventDefault();
    } else if (draft && draft.verts.length) {
      draft.verts.pop();
      if (!draft.verts.length) draft = null;
      render();
      if (draft) draftStatus(); else say('draft empty');
      ev.preventDefault();
    }
  } else if (ev.key === 'Escape') {
    draft = null; chainPreview = null; countDraft = [];
    render();
    say('cancelled');
  }
});

// ---- controls ----
$('file').addEventListener('change', async ev => {
  const f = ev.target.files[0];
  if (!f) return;
  await loadPdf(await f.arrayBuffer(), f.name);
});
/// Cancel everything transient (drafts, previews, calibration clicks,
/// hover, list hover, debounce) — page switches, file loads, and tool
/// changes must never leak in-progress state across the transition.
function cancelTransients(reason) {
  const hadDraft = draft || chainPreview || calibPts.length || countDraft.length;
  draft = null; chainPreview = null; calibPts = []; countDraft = [];
  hover = null; hoverMeas = null; lastClick = null;
  $('calibEntry').hidden = true;
  if (hadDraft && reason) say(`draft cancelled (${reason})`);
}

async function loadPdf(data, name) {
  // Content-address the bytes: same file → same project under any name.
  // pdf.js may detach its input buffer, so hash/store the original and
  // hand pdf.js a copy.
  const bytes = data instanceof ArrayBuffer ? data : data.buffer;
  currentBytes = bytes.slice(0);
  currentName = name;
  currentSha = await store.sha256(currentBytes);
  storageBlocked = false;
  pdfDoc = await pdfjs.getDocument({ data: bytes.slice(0) }).promise;
  pageNum = 1; extractCache.clear(); detCache = null;
  cancelTransients(null);
  minWidthOverride = null;

  // Restore a saved project for this content, or start fresh.
  let proj = null;
  try { proj = await store.getProject(currentSha); } catch { /* read-only failure: start fresh */ }
  if (proj) {
    scalesFromStored(proj.pageScales);
    measurements = proj.measurements.map(fromStored);
    minWidthOverride = proj.minWidthOverride ?? null;
    reindexAfterRestore();
    setSaveState(`Saved ${new Date(proj.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`);
  } else {
    pageScales.clear(); pageScales.set(0, { fpi: 4.0, source: 'synthetic' });
    measurements = []; nextMeasId = 1;
    measSeq = { Line: 0, Area: 0, 'Wall run': 0, Room: 0, Count: 0 };
    setSaveState('—'); // no project until the first mutation
  }

  const base = (await pdfDoc.getPage(1)).getViewport({ scale: 1 });
  pageDims = { w: base.width, h: base.height };
  fitS = fitWidthScale();
  s = fitS;
  refreshScaleUI();
  renderMeasList();
  await renderPage();
  const restored = proj ? ` — restored ${measurements.length} measurement(s)` : '';
  say(`${name}: ${pdfDoc.numPages} page(s)${restored}. Pick a preset scale or calibrate on a known dimension.`);
}

/// The one page-switch path: transients cancel (a polygon spanning two
/// sheets is meaningless), then view + panel resync to the new page.
async function changePage(n) {
  if (!pdfDoc || n < 1 || n > pdfDoc.numPages || n === pageNum) return;
  cancelTransients('page change');
  pageNum = n;
  refreshScaleUI();
  renderMeasList();
  await renderPage();
}
$('zoomIn').addEventListener('click', () => setZoom(s * 1.25, null));
$('zoomOut').addEventListener('click', () => setZoom(s / 1.25, null));
$('zoomFit').addEventListener('click', async () => {
  if (!pdfDoc) return;
  fitS = fitWidthScale();
  await setZoom(fitS, null);
  const wrap = $('canvasWrap');
  wrap.scrollLeft = 0; wrap.scrollTop = 0;
});
canvas.addEventListener('wheel', ev => {
  if (!ev.ctrlKey || !pdfDoc) return;
  ev.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const anchor = {
    x: (ev.clientX - rect.left) * canvas.width / rect.width / s,
    y: (ev.clientY - rect.top) * canvas.height / rect.height / s,
  };
  setZoom(ev.deltaY < 0 ? s * 1.25 : s / 1.25, anchor);
}, { passive: false });
$('prev').addEventListener('click', () => changePage(pageNum - 1));
$('next').addEventListener('click', () => changePage(pageNum + 1));
$('preset').addEventListener('change', ev => {
  if (!ev.target.value) return;
  applyScaleChange(parseFloat(ev.target.value), 'preset'); // view stays put
  say(`scale set from preset for page ${currentPage()}. Click a room.`);
});
$('calibBtn').addEventListener('click', ev => {
  setTool('calibrate');
  ev.target.blur();
});
for (const btn of document.querySelectorAll('#tools .tool')) {
  btn.addEventListener('click', ev => {
    setTool(btn.dataset.tool);
    ev.target.blur(); // keep Enter for finishing drafts, not re-clicking
  });
}
$('calibApply').addEventListener('click', () => applyCalibration(parseFloat($('calibFeet').value)));
$('thresh').addEventListener('input', () => { $('threshVal').textContent = $('thresh').value; });
$('doorGap').addEventListener('input', () => { $('doorGapVal').textContent = $('doorGap').value; });
$('maskRaster').addEventListener('change', render);
$('maskVector').addEventListener('change', render);
$('hideHatch').addEventListener('change', render);
$('allPages').addEventListener('change', renderMeasList);
$('projectsBtn').addEventListener('click', () => {
  const panel = $('projectPanel');
  panel.hidden = !panel.hidden;
  if (!panel.hidden) renderProjectPanel();
});
$('storageExport').addEventListener('click', () => $('exportJson').click());
$('storageDismiss').addEventListener('click', () => {
  storageBlocked = false;
  $('storageModal').hidden = true;
  setSaveState('unsaved…');
});
$('exportCsv').addEventListener('click', () => {
  if (!measurements.length) { say('no measurements to export'); return; }
  const blob = new Blob([buildCsv()], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'takeoff.csv';
  a.click();
  URL.revokeObjectURL(url);
  say(`exported ${measurements.length} measurement(s) to takeoff.csv`);
});
$('exportJson').addEventListener('click', () => {
  if (!currentSha) { say('open a PDF before exporting a project'); return; }
  const blob = new Blob([exportJson()], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${(currentName || 'project').replace(/\.pdf$/i, '')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  say('exported JSON project backup');
});
$('importJson').addEventListener('change', async ev => {
  const f = ev.target.files[0];
  if (!f) return;
  try {
    importJson(await f.text());
    say(`imported ${measurements.length} measurement(s) from ${f.name}`);
  } catch (e) {
    say(`import failed: ${e?.message ?? e}`);
  }
  ev.target.value = ''; // allow re-importing the same file
});
$('minWidth').addEventListener('input', () => {
  minWidthOverride = minWidthPts(); // sticky for the session
  $('minWidthVal').textContent = minWidthPts().toFixed(2);
  $('minWidthReset').hidden = false;
  render();
  markDirty();
});
$('minWidthReset').addEventListener('click', () => {
  minWidthOverride = null;
  if (pageGeom) syncMinWidth(pageGeom.default_min_width());
  markDirty();
  $('minWidthReset').blur();
  render();
});

// Read-only state hook for the interaction test suite (harness/tests).
window.__harness = {
  measurements: () => measurements,
  tool: () => tool,
  draft: () => draft,
  countDraft: () => countDraft,
  chainPreview: () => chainPreview,
  s: () => s,
  page: () => currentPage(),
  pageScales: () => Object.fromEntries([...pageScales].map(([p, v]) => [p, v.fpi])),
  buildCsv: () => buildCsv(),
  loadPdf,
  currentSha: () => currentSha,
  flushSave: () => flushSave(),
  listProjects: () => store.listProjects(),
  deleteProject: sha => store.deleteProject(sha),
  exportJson: () => exportJson(),
  importJson: str => importJson(str),
  simulateStorageError: () => onStorageError(new Error('simulated quota exceeded')),
  storageBlocked: () => storageBlocked,
};

// ---- boot ----
await init();
store.requestPersist(); // best-effort: keep our storage across eviction
for (const p of JSON.parse(scale_presets_json())) {
  const o = document.createElement('option');
  o.value = p.fpi; o.textContent = p.label;
  $('preset').appendChild(o);
}
await renderPage();
say('wasm loaded — click inside a room, or load a PDF.');

// Deep-link/self-test affordance (also drives headless smoke tests):
// ?url=/plans/x.pdf&page=N&fpi=F&threshold=T&door=D&autoclick=x,y
//   &calib=x1,y1,x2,y2,feet   (BASE UNITS + feet; runs after render)
//   &mask=vector|raster&minwidth=W   (applied after geometry loads)
// autoclick/calib coordinates are BASE UNITS (PDF points): display scale
// is user-driven and no longer a stable coordinate system.
const qs = new URLSearchParams(location.search);
if (qs.has('threshold')) { $('thresh').value = qs.get('threshold'); $('threshVal').textContent = $('thresh').value; }
if (qs.has('door')) { $('doorGap').value = qs.get('door'); $('doorGapVal').textContent = $('doorGap').value; }
if (qs.has('url')) {
  const resp = await fetch(qs.get('url'));
  await loadPdf(await resp.arrayBuffer(), qs.get('url'));
  if (qs.has('page')) { pageNum = parseInt(qs.get('page'), 10); await renderPage(); }
  if (qs.has('fpi')) {
    // Seeds the CURRENT page's scale only (after any page= param).
    applyScaleChange(parseFloat(qs.get('fpi')), 'param');
  }
}
if (qs.get('mask') === 'raster') { $('maskRaster').checked = true; render(); }
if (qs.get('mask') === 'vector' && !$('maskVector').disabled) {
  $('maskVector').checked = true; render();
}
if (qs.has('minwidth') && !$('minWidth').disabled) {
  $('minWidth').value = qs.get('minwidth');
  $('minWidthVal').textContent = minWidthPts().toFixed(2);
  render();
}
if (qs.has('calib')) {
  const [x1, y1, x2, y2, feet] = qs.get('calib').split(',').map(Number);
  calibPts = [{ x: x1, y: y1 }, { x: x2, y: y2 }]; // base units
  applyCalibration(feet);
}
if (qs.has('autoclick')) {
  const [ax, ay] = qs.get('autoclick').split(',').map(Number); // base units
  await runDetect(ax, ay);
}

// No file open (no deep-link) and saved projects exist → surface them so
// a reload lands the user back on their work in one click.
if (!qs.has('url') && (await store.listProjects()).length) {
  $('projectPanel').hidden = false;
  await renderProjectPanel();
}
</script>
</body>
</html>
