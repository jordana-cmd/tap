name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbidden browser imports in engine-core
        run: ./ci/check-forbidden-imports.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Snap budget (release, asserted)
        run: cargo test --release --test snap_budget -- --nocapture

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Wasm bundle (Engine Foundation exit criterion)
        run: wasm-pack build crates/engine-web --target web --release

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Coverage gates engine-core only: engine-web is wasm-bindgen boundary
      # glue whose plain-Rust logic is unit-tested natively but has no
      # meaningful native coverage surface for the wrappers. Revisit once
      # engine-web's non-wrapper logic exceeds ~100 lines — then give it its
      # own gated coverage run with the #[wasm_bindgen] wrappers excluded,
      # so it doesn't drift into an untested crate by default.
      - name: Coverage (>90% lines, engine-core)
        run: cargo llvm-cov -p engine-core --all-features --fail-under-lines 90
